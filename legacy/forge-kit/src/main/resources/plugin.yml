name: ForgeKit
version: '1.0.1'
main: com.rosetta.forgekit.ForgeKitPlugin
api-version: '1.20'
authors: [Rosetta]
description: Hot-loadable Forge API demo (runtime bus events + registry introspection from a Bukkit plugin).
commands:
  forgekit:
    description: Forge API demo
    usage: /forgekit <mods|guard <class-substring|off>|status>
    permission: forgekit.admin
permissions:
  forgekit.admin:
    description: access to /forgekit
    default: op
